name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next build` is also the strictest type check — the static export
      # surfaces TS and prerender errors the dev server tolerates.
      - name: Build
        run: pnpm build
