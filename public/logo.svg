<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper Desktop app mark: a flat window with a sprout, on rust. Full-bleed
       background so it reads as a maskable PWA icon. No gradients. -->
  <rect width="512" height="512" fill="#9C4A2E"/>
  <!-- window -->
  <rect x="116" y="116" width="280" height="280" rx="16" fill="#FBF7EE"/>
  <!-- flat title bar -->
  <path d="M116 132C116 123.163 123.163 116 132 116H380C388.837 116 396 123.163 396 132V172H116V132Z" fill="#E4DBC5"/>
  <rect x="116" y="170" width="280" height="2" fill="#C9BDA2"/>
  <!-- sprout -->
  <path d="M256 356V258" stroke="#5A6B3B" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 300C214 300 186 272 186 232C228 232 256 260 256 300Z" fill="#5A6B3B"/>
  <path d="M256 286C298 286 326 258 326 218C284 218 256 246 256 286Z" fill="#6B7E47"/>
</svg>
